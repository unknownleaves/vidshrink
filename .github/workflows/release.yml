# On every push to main, on Windows:
#   1. tests the app by driving the real window (CPU, GPU-fallback, parallel, paused and
#      cancelled batches) and saves screenshots to the "ci-screenshots" branch,
#   2. builds VidShrink.exe and checks that it starts,
#   3. if VERSION in vidshrink_core.py is new, publishes the GitHub Release "vX.Y.Z";
#      installed copies then offer to update.
# You can also run it by hand: Actions tab -> Test & Release -> Run workflow.
name: Test & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-and-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compile check
        run: python -m py_compile vidshrink.py vidshrink_core.py

      - name: GUI smoke test
        env:
          SCREENSHOT_DIR: screenshots
        run: python tests/smoke_gui.py

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        shell: bash
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots

      - name: Build VidShrink.exe
        run: pyinstaller --noconfirm --onefile --windowed --name VidShrink --icon vidshrink.ico --add-data "vidshrink.ico;." --add-data "icon.png;." vidshrink.py

      - name: Check VidShrink.exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist/VidShrink.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "VidShrink.exe did not exit (hung?)" }
          if ($p.ExitCode -ne 0) { throw "VidShrink.exe self-test failed with exit code $($p.ExitCode)" }
          $mb = [math]::Round((Get-Item dist/VidShrink.exe).Length / 1MB, 1)
          Write-Host "::notice::VidShrink.exe starts fine ($mb MB)"

      - name: Read VERSION and check whether it's already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path vidshrink_core.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "Could not find VERSION = `"...`" in vidshrink_core.py" }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$v is already released - bump VERSION in vidshrink_core.py to publish an update."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing v$v"
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Package release files
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VidShrink.exe release/
          git archive --format=zip --prefix=VidShrink/ -o release/VidShrink-source.zip HEAD
          $sums = Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: VidShrink ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
