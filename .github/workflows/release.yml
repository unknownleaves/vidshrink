# On every push to main: tests the app on Windows (drives the real window through
# CPU, GPU-fallback, parallel and cancelled batches).
# If the tests pass and VERSION in vidshrink.py is new, it builds VidShrink.exe and
# publishes the GitHub Release "vX.Y.Z"; installed copies then offer to update.
# You can also run it by hand: Actions tab -> Test & Release -> Run workflow.
name: Test & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile vidshrink.py
      - name: GUI smoke test
        run: python tests/smoke_gui.py

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check whether it's already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path vidshrink.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "Could not find VERSION = `"...`" in vidshrink.py" }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$v is already released - bump VERSION in vidshrink.py to publish an update."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing v$v"
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Build VidShrink.exe
        if: steps.ver.outputs.skip != 'true'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name VidShrink --icon vidshrink.ico --add-data "vidshrink.ico;." vidshrink.py

      - name: Package release files
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VidShrink.exe release/
          git archive --format=zip --prefix=VidShrink/ -o release/VidShrink-source.zip HEAD
          $sums = Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: VidShrink ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
